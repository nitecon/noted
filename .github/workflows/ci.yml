name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: apps/noted-desktop
        run: npm install --no-audit --no-fund

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust check
        run: cargo check --workspace

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Desktop frontend build
        working-directory: apps/noted-desktop
        run: npm run build

  release:
    name: Release (${{ matrix.platform.name }})
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS (Intel)
            os: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Windows
            os: windows-latest
            target: ""
            args: --bundles nsis
          - name: Linux
            os: ubuntu-22.04
            target: ""
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: apps/noted-desktop
        run: npm install --no-audit --no-fund

      - name: Stamp release version
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION.replace(/^v/, "");
          const updates = [
            "apps/noted-desktop/package.json",
            "apps/noted-desktop/package-lock.json",
            "apps/noted-desktop/src-tauri/tauri.conf.json",
          ];
          for (const path of updates) {
            const data = JSON.parse(fs.readFileSync(path, "utf8"));
            data.version = version;
            if (data.packages?.[""]) {
              data.packages[""].version = version;
            }
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }
          const cargoManifests = [
            "apps/noted-desktop/src-tauri/Cargo.toml",
            "crates/noted-cli/Cargo.toml",
            "crates/noted-core/Cargo.toml",
          ];
          for (const path of cargoManifests) {
            const cargo = fs.readFileSync(path, "utf8");
            fs.writeFileSync(path, cargo.replace(/^version = ".*"$/m, `version = "${version}"`));
          }
          NODE

      - name: Build and upload release asset
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization (no-ops on Linux/Windows runners).
          # Required GitHub repo secrets:
          #   APPLE_CERTIFICATE              - base64 of Developer ID Application .p12
          #   APPLE_CERTIFICATE_PASSWORD     - password for that .p12
          #   APPLE_SIGNING_IDENTITY         - "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID                       - Apple ID email
          #   APPLE_PASSWORD                 - app-specific password for that Apple ID
          #   APPLE_TEAM_ID                  - 10-char Apple developer team ID
          #   KEYCHAIN_PASSWORD              - any random string (temp keychain pw)
          #   TAURI_SIGNING_PRIVATE_KEY      - private updater key from `tauri signer generate`
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - updater key password, if one was set
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/noted-desktop
          args: ${{ matrix.platform.args }}
          assetNamePattern: noted_[platform]_[arch]_[version][ext]
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_name }}
          releaseName: Noted ${{ github.ref_name }}
          releaseBody: Desktop builds for Noted ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
